name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org/
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Use the current npm CLI
        run: npm install --global npm@latest
      - name: Check the release tag and package identity
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            if (pkg.name !== "@jlynx_/acars-decoder" || process.env.RELEASE_TAG !== `v${pkg.version}`) {
              throw new Error("Release tag must match v + package.json version and the expected npm package name");
            }
          '
      - run: npm ci
      - run: npm run test:coverage
      - name: Validate, build and submit for approval
        env:
          NPM_RELEASE_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm stage publish --access public --provenance --tag "$NPM_RELEASE_TAG"
